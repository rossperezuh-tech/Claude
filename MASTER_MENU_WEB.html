<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Menu — Steadyhand</title>
<style>
  :root{
    --ground:#f5f2ea; --card:#fbf9f4; --ink:#1c1a17; --muted:#5a554c;
    --hair:#d9d3c6; --accent:#b0341d; --good:#2f8f5b;
    --sans:'Helvetica Neue',Arial,sans-serif;
    --cond:'Arial Narrow','Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'SFMono-Regular','Menlo','Consolas',monospace;
    --serif:Georgia,'Times New Roman',serif;
    /* product-UI tokens (inside app mocks) */
    --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --appbg:#ffffff; --appline:#e9e3d7; --appmut:#6b6a66; --appink:#1f1e1c;
    --pri:#b0341d; --pri-weak:#f7e9e5;
    --warn:#c9862a; --warn-weak:#f7efdf; --bad:#c8402f; --bad-weak:#f8e7e4;
    --good-weak:#e5f2ea; --blue:#2f6fb0; --blue-weak:#e7eff7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 28px 64px}

  /* ---------------- MENU VIEW ---------------- */
  .mast{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
  .mast h1{font-family:var(--cond);font-weight:800;font-size:clamp(52px,11vw,92px);
    line-height:.85;letter-spacing:-1px;transform:scaleX(.92);transform-origin:left}
  .mast .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin-top:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:34px 48px;margin-top:26px}
  @media(max-width:760px){.cols{grid-template-columns:1fr;gap:26px}}
  .grp-title{font-size:14px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    padding-bottom:6px;border-bottom:1.5px solid var(--accent);margin-bottom:4px}
  .row{display:flex;gap:14px;align-items:center;padding:11px 4px 11px 0;border-bottom:1px solid var(--hair);transition:background .15s,padding .15s}
  .row:last-child{border-bottom:none}
  .row .rmain{flex:1;min-width:0}
  .row .nm{font-size:14px;font-weight:700}
  .row .ds{font-size:12px;color:var(--muted)}
  .row .rprice{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap;line-height:1.15}
  .row .rprice span{display:block;font-size:9.5px;font-weight:400;letter-spacing:.2px;color:var(--muted)}
  .row:hover{background:var(--card);padding-left:10px}
  .row:hover .nm{color:var(--accent)}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .footer{margin-top:40px;padding-top:16px;border-top:3px solid var(--ink);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
  .footer b{color:var(--ink)}
  .footer .mail{font-weight:700;color:var(--ink)}
  .footer .mail span{color:var(--accent)}

  /* ---------------- EXAMPLE VIEW ---------------- */
  #example{display:none}
  body.showing-example #menu{display:none}
  body.showing-example #example{display:block}
  .back{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
    font-size:12px;letter-spacing:.5px;color:var(--accent);padding:8px 0;margin-bottom:16px}
  .back:hover{text-decoration:underline}
  .ex-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .ex-title{font-family:var(--cond);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.5px;transform:scaleX(.94);transform-origin:left}
  .ex-blurb{font-size:16px;color:var(--muted);margin-top:12px;max-width:60ch}
  .ex-hr{height:1px;background:var(--hair);margin:24px 0}
  .disclaim{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:20px;text-align:center;letter-spacing:.3px}

  /* ============ APP MOCK FRAMEWORK ============ */
  .app{background:var(--appbg);border:1px solid var(--appline);border-radius:11px;overflow:hidden;
    box-shadow:0 14px 40px rgba(28,26,23,.13),0 3px 8px rgba(28,26,23,.06);
    font-family:var(--ui);color:var(--appink);font-size:13.5px;line-height:1.45}
  .app + .app{margin-top:18px}
  .app-bar{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#f6f3ee;border-bottom:1px solid var(--appline)}
  .dots{display:flex;gap:7px}
  .dots i{width:11px;height:11px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#f0655a}.dots i:nth-child(2){background:#f5bf4f}.dots i:nth-child(3){background:#57c15b}
  .app-title{font-size:12.5px;font-weight:600;color:#4a4844}
  .demo{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--appmut);
    border:1px solid var(--appline);border-radius:999px;padding:2px 7px;background:#fff}
  .app-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .app-body{padding:16px}
  .app-body.flush{padding:0}

  .btn{font-family:var(--ui);font-size:12px;font-weight:600;padding:7px 13px;border-radius:7px;border:1px solid var(--appline);background:#fff;color:var(--appink);cursor:default;display:inline-flex;align-items:center;gap:6px}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn.sm{padding:5px 10px;font-size:11px}

  .pill{font-family:var(--ui);font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill.good{background:var(--good-weak);color:#1f6f47}
  .pill.warn{background:var(--warn-weak);color:#8a5a12}
  .pill.bad{background:var(--bad-weak);color:#a12e20}
  .pill.blue{background:var(--blue-weak);color:#255a8f}
  .pill.mut{background:#f0ede7;color:#6b6a66}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}

  .av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;flex:none}

  .lbl{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--appmut);font-weight:600}
  .mut{color:var(--appmut)}
  .tnum{font-variant-numeric:tabular-nums}

  /* data table */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--appmut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--appline);background:#faf8f4}
  .tbl td{padding:11px 14px;border-bottom:1px solid #f0ece4;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.hl td{background:var(--pri-weak)}
  .tbl .r{text-align:right}

  /* chat */
  .chat{background:#fff}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--appline)}
  .chat-body{padding:16px;display:flex;flex-direction:column;gap:12px;background:#faf9f6}
  .msg{max-width:78%;padding:10px 13px;border-radius:15px;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
  .msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--appline);border-bottom-left-radius:5px}
  .msg .t{display:block;font-size:10px;margin-top:5px;opacity:.7}
  .vn{display:flex;align-items:center;gap:10px}
  .wave{display:flex;gap:2px;align-items:center;height:22px}
  .wave i{width:3px;border-radius:2px;background:currentColor;opacity:.9}
  .play{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px}

  /* doc viewer */
  .docview{display:grid;grid-template-columns:1fr 1fr;min-height:290px}
  @media(max-width:760px){.docview{grid-template-columns:1fr}}
  .pages{background:#eceae4;padding:16px;border-right:1px solid var(--appline);position:relative}
  .paper{background:#fff;border:1px solid #ddd8cd;border-radius:3px;padding:16px 15px;font-size:10.5px;line-height:1.8;color:#3a3934;box-shadow:0 4px 12px rgba(0,0,0,.06);height:100%}
  .paper h6{font-size:11px;letter-spacing:.5px;margin-bottom:8px;color:#1f1e1c}
  .hl{background:#fdf2b0;padding:1px 2px;border-radius:2px}
  .hl.risk{background:#f8d2cc}
  .pgtag{position:absolute;bottom:10px;right:12px;font-family:var(--mono);font-size:9.5px;color:var(--appmut)}
  .analysis{padding:16px 18px}
  .analysis h5{font-size:13px;margin-bottom:4px}
  .an-sec{margin-top:14px}
  .an-list{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .an-list li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
  .an-list .ck{color:var(--good);font-weight:700}

  /* search */
  .omni{display:flex;align-items:center;gap:10px;border:1px solid var(--appline);border-radius:9px;padding:10px 13px;margin-bottom:6px;background:#faf8f4}
  .omni .q{font-size:14px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
  .chip2{font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid var(--appline);background:#fff;color:var(--appmut)}
  .chip2.on{background:var(--pri-weak);border-color:var(--pri);color:#8f2a17}
  .res{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f0ece4}
  .res:last-child{border-bottom:none}
  .ficon{width:34px;height:40px;border-radius:4px;flex:none;display:flex;align-items:flex-end;justify-content:center;
    font-size:8px;font-weight:800;color:#fff;padding-bottom:4px;letter-spacing:.5px}

  /* stats + spark */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}}
  .stat{border:1px solid var(--appline);border-radius:9px;padding:12px 13px;background:#fff}
  .stat .v{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .stat .v small{font-size:11.5px;font-weight:700}
  .up{color:var(--good)}.down{color:var(--bad)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{border:1px solid var(--appline);border-radius:9px;padding:14px;background:#fff}
  .panel h5{font-size:12px;margin-bottom:10px}
  .jrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0ece4;font-size:12.5px}
  .jrow:last-child{border-bottom:none}

  /* gauges */
  .gauges{display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:center}
  .gauge{text-align:center}
  .gauge .cap{font-size:11px;color:var(--appmut);margin-top:6px}
  .gauge .sc{font-size:12px;font-weight:700;margin-top:2px}

  /* reviews */
  .revwrap{display:grid;grid-template-columns:200px 1fr;gap:18px}
  @media(max-width:760px){.revwrap{grid-template-columns:1fr}}
  .bigscore{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
  .stars{color:#e6a817;font-size:15px;letter-spacing:1px}
  .themebar{margin:9px 0}
  .themebar .tb{height:7px;border-radius:5px;background:#efece5;overflow:hidden;margin-top:4px}
  .themebar .tb i{display:block;height:100%}
  .revcard{border:1px solid var(--appline);border-radius:9px;padding:12px;background:#fff;margin-bottom:10px}
  .revcard:last-child{margin-bottom:0}
  .srcbadge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px}

  /* checklist */
  .prog{height:8px;border-radius:6px;background:#efece5;overflow:hidden;margin:10px 0 4px}
  .prog i{display:block;height:100%;background:var(--good)}
  .chk{display:flex;align-items:flex-start;gap:11px;padding:12px 4px;border-bottom:1px solid #f0ece4}
  .chk:last-child{border-bottom:none}
  .box{width:19px;height:19px;border-radius:5px;border:1.5px solid #cfc9bc;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
  .box.done{background:var(--good);border-color:var(--good)}
  .chk .sub{font-size:11.5px;color:var(--appmut)}

  /* invoice + email */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.split{grid-template-columns:1fr}}
  .doc{border:1px solid var(--appline);border-radius:9px;padding:18px;background:#fff}
  .doc .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .doc .big{font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:-.5px}
  .liner{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0ece4;font-size:12.5px}
  .liner.tot{border-bottom:none;border-top:2px solid var(--appink);font-weight:800;margin-top:4px;padding-top:9px}
  .mail{border:1px solid var(--appline);border-radius:9px;background:#fff;overflow:hidden}
  .mail .mh{padding:9px 13px;border-bottom:1px solid #f0ece4;font-size:12px;display:flex;gap:8px}
  .mail .mh .k{color:var(--appmut);width:44px}
  .mail .mb{padding:13px;font-size:12.5px;color:#3a3934;line-height:1.6}

  /* social */
  .igwrap{display:grid;grid-template-columns:230px 1fr;gap:18px}
  @media(max-width:760px){.igwrap{grid-template-columns:1fr}}
  .ig{border:1px solid var(--appline);border-radius:12px;overflow:hidden;background:#fff}
  .ig .top{display:flex;align-items:center;gap:9px;padding:9px 11px}
  .ig .img{aspect-ratio:1;background:
     radial-gradient(120% 120% at 20% 15%, #a7c957 0%, #5b8a3a 45%, #2f5233 100%)}
  .ig .acts{display:flex;gap:12px;padding:9px 11px 4px;font-size:15px}
  .ig .cap{padding:0 11px 12px;font-size:12px}
  .capopt{border:1px solid var(--appline);border-radius:9px;padding:11px 12px;background:#fff;margin-bottom:9px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
  .capopt:last-child{margin-bottom:0}

  /* flow / automation */
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
  .node{border:1px solid var(--appline);border-radius:10px;padding:12px;background:#fff;min-width:150px;flex:1}
  .node.flag{border-color:var(--bad);background:var(--bad-weak)}
  .node .ic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:8px}
  .arrow{display:flex;align-items:center;justify-content:center;color:#c5bfb2;font-size:20px;padding:0 6px;flex:none}
  .callout{border:1px solid var(--appline);border-left:3px solid var(--pri);border-radius:8px;padding:12px 14px;background:#fff;margin-top:14px}
  .callout .h{font-weight:700;margin-bottom:3px}

  /* brand board */
  .board{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  @media(max-width:760px){.board{grid-template-columns:1fr}}
  .card-mock{background:#2f5233;color:#f2e8cf;border-radius:10px;padding:20px;height:140px;display:flex;flex-direction:column;justify-content:space-between}
  .sw{display:flex;gap:9px;flex-wrap:wrap}
  .sw div{flex:1;min-width:52px}
  .sw i{display:block;height:40px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
  .sw small{font-family:var(--mono);font-size:9.5px;color:var(--appmut);display:block;margin-top:4px}

  /* website mock */
  .site{background:#fff}
  .site .nav{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid #eee;font-size:12px}
  .site .brand{font-family:var(--cond);font-weight:800;font-size:16px;letter-spacing:.5px}
  .site .hero{padding:40px 24px;text-align:center;
     background:linear-gradient(180deg,#f6f8f2 0%,#eef2e6 100%)}
  .site .hero h3{font-family:var(--cond);font-weight:800;font-size:34px;line-height:1;margin-bottom:10px}
  .site .hero p{font-size:13px;color:#5a6152;max-width:38ch;margin:0 auto 16px}
  .site .cta{display:inline-block;background:var(--pri);color:#fff;font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:8px}
  .site .feats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:22px 24px}
  @media(max-width:760px){.site .feats{grid-template-columns:1fr}}
  .site .feat{text-align:center;font-size:11px;color:#5a6152}
  .site .feat .fi{width:36px;height:36px;border-radius:9px;background:#e6efd8;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:17px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<!-- ======================= MENU ======================= -->
<main id="menu">
  <div class="wrap">
    <div class="mast">
      <h1>THE&nbsp;MENU</h1>
      <div class="sub">Tap any item to see a real example of what it produces.</div>
    </div>
    <div class="cols" id="cols"></div>
    <div class="footer">
      <div><b>How it works:</b> Pick what you need → 30-minute sit-down → we build it → we teach you to run it.</div>
      <div class="mail">Let's talk — <span>ross@steadyhand.ai</span></div>
    </div>
  </div>
</main>

<!-- ======================= EXAMPLE ======================= -->
<main id="example">
  <div class="wrap">
    <a class="back" href="#" id="backlink">← Back to the menu</a>
    <div class="ex-eyebrow" id="exEyebrow"></div>
    <h2 class="ex-title" id="exTitle"></h2>
    <p class="ex-blurb" id="exBlurb"></p>
    <div class="ex-hr"></div>
    <div id="exBody"></div>
    <div class="disclaim">Demo build with sample data — your version runs on your own business.</div>
  </div>
</main>

<script>
/* ---------- helpers ---------- */
const app=(title,body,o={})=>`<div class="app"><div class="app-bar"><div class="dots"><i></i><i></i><i></i></div><span class="app-title">${title}</span><span class="demo">${o.tag||'SAMPLE'}</span>${o.action?`<span class="app-actions">${o.action}</span>`:''}</div><div class="app-body${o.flush?' flush':''}">${body}</div></div>`;
const av=(t,c)=>`<span class="av" style="background:${c}">${t}</span>`;
const stars=n=>'★'.repeat(Math.floor(n))+(n%1?'½':'')+'☆'.repeat(5-Math.ceil(n));
const wave=(c,arr)=>`<span class="wave" style="color:${c}">`+arr.map(h=>`<i style="height:${h}px"></i>`).join('')+`</span>`;

const DATA=[
 /* ---------- WEBSITES & STOREFRONT ---------- */
 {slug:"the-new-website",group:"Websites & Storefront",name:"New Website",
  blurb:"Designed and built from scratch, with a dashboard you edit yourself.",
  body: app("greenpointsupply.com",
    `<div class="site">
       <div class="nav"><span class="brand">GREENPOINT SUPPLY</span><span class="mut">Shop &nbsp; About &nbsp; Contact &nbsp; <span class="btn sm pri" style="padding:5px 11px">Cart · 2</span></span></div>
       <div class="hero"><h3>Built for the way you work.</h3><p>Tools, hardware, and same-day delivery across North Brooklyn.</p><span class="cta">Shop the store →</span></div>
       <div class="feats">
         <div class="feat"><div class="fi">🚚</div>Same-day local delivery</div>
         <div class="feat"><div class="fi">🔧</div>1,200+ pro-grade items</div>
         <div class="feat"><div class="fi">↩️</div>No-hassle returns</div>
       </div>
     </div>`,
    {tag:"LIVE SITE",action:`<span class="btn sm">Edit page</span>`}) +
    `<p class="mut" style="font-size:12.5px;margin-top:12px">Delivered in 2 weeks. You change text, prices, and photos yourself — no developer, no monthly agency fee.</p>`},

 {slug:"the-website-tune-up",group:"Websites & Storefront",name:"Website Tune-Up",
  blurb:"Make your current site fast, findable, and easy to update.",
  body: app("Site Report — oldshop.com",
    `<div class="gauges">
       ${gaugeSVG(44,"#c8402f")}
       <div style="font-size:26px;color:#c5bfb2">→</div>
       ${gaugeSVG(98,"#2f8f5b")}
     </div>
     <table class="tbl" style="margin-top:8px">
       <tr><th>Check</th><th class="r">Before</th><th class="r">After</th><th></th></tr>
       <tr><td>Load time</td><td class="r tnum">6.2s</td><td class="r tnum">0.9s</td><td class="r"><span class="pill good"><span class="d"></span>Passed</span></td></tr>
       <tr><td>Google — your own name</td><td class="r">page 3</td><td class="r">page 1, #1</td><td class="r"><span class="pill good"><span class="d"></span>Passed</span></td></tr>

/* ---------- tiny inline charts ---------- */
function spark(vals,color){
  const w=120,h=26,max=Math.max(...vals),min=Math.min(...vals);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/(max-min||1))*(h-4)-2}`).join(' ');
  return `<svg width="100%" height="26" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="margin-top:8px;display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function bars(vals,labels){
  const max=Math.max(...vals);
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:120px">`+
    vals.map((v,i)=>`<div style="flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:${(v/max)*100}%;background:var(--pri);opacity:.85;border-radius:3px 3px 0 0"></div><div class="mut" style="font-size:10px;margin-top:5px">${labels[i]}</div></div>`).join('')+`</div>`;
}
function areaChart(){
  const w=560,h=170,pad=32;
  const vals=[41,46,35,28,22,18], labels=["Jul","Aug","Sep","Oct","Nov","Dec"];
  const max=50,min=0;
  const X=i=>pad+(i/(vals.length-1))*(w-pad*2);
  const Y=v=>h-24-((v-min)/(max-min))*(h-40);
  const line=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const area=`${pad},${h-24} ${line} ${w-pad},${h-24}`;
  const dots=vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="var(--pri)" stroke-width="2"/><text x="${X(i)}" y="${Y(v)-9}" font-size="10" fill="#1f1e1c" text-anchor="middle" font-family="var(--mono)">$${v}k</text>`).join('');
  const labs=labels.map((l,i)=>`<text x="${X(i)}" y="${h-6}" font-size="10" fill="#6b6a66" text-anchor="middle">${l}</text>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b0341d" stop-opacity="0.20"/><stop offset="1" stop-color="#b0341d" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#ag)"/><polyline points="${line}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labs}</svg>`;
}
function gaugeSVG(score,color){
  const r=30,c=2*Math.PI*r,off=c*(1-score/100);
  return `<div class="gauge"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#efece5" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#1f1e1c">${score}</text></svg><div class="sc" style="color:${color}">${score<50?'Poor':'Great'}</div></div>`;
}

const LEFT=["Websites & Storefront","AI Assistant","Get More Done"];
const RIGHT=["Money & Numbers","Decisions","Paperwork & Content"];
const bySlug=Object.fromEntries(DATA.map(d=>[d.slug,d]));
function groupHTML(g){
  const items=DATA.filter(d=>d.group===g).map(d=>`
    <a class="row" href="#${d.slug}">
      <div class="rmain"><div class="nm">${d.name}</div><div class="ds">${d.blurb}</div></div>
    </a>`).join("");

}
document.getElementById("cols").innerHTML=

/* ---------- router ---------- */
function render(){
  const slug=location.hash.replace(/^#/,"");
  const d=bySlug[slug];
  if(d){
    document.getElementById("exEyebrow").textContent=d.group;
    document.getElementById("exTitle").textContent=d.name;
    document.getElementById("exBlurb").textContent=d.blurb;
    document.getElementById("exBody").innerHTML=d.body;
    document.body.classList.add("showing-example");
    window.scrollTo(0,0);
  }else{
    document.body.classList.remove("showing-example");
  }
}
document.getElementById("backlink").addEventListener("click",e=>{
  e.preventDefault();history.pushState("",document.title,location.pathname+location.search);render();
});
window.addEventListener("hashchange",render);
render();
